<!DOCTYPE HTML>
<HTML>
<HEAD>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta charset="UTF 8">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>UNIMA REGISTRATION PAGE</title>
<style>
    *{
        font-family: Arial, Helvetica, sans-serif;
    }
    body{
        background:linear-gradient(90deg,rgb(99, 99, 251),rgb(232, 60, 232));
    }
    header{
        background-color:rgb(1, 1, 86);
        padding:8px;
        font-size:20px;
        position:fixed;
        top:0;
        right:0;
        z-index:10;
        width:100%;
        display:flex;
        justify-content: space-between;
        align-items:center;
        gap:50px;
    }
    header p{
        color:#fff;
        font-weight:999;
    }

    .logo img{
        height:40px;
        width:40px;
        border-radius:30px;
        margin-left:12px;
    }
    .nav,ul{
        display:flex;
        justify-content:flex-end;
        color:#fff;
        margin: auto;
    }
    .nav li{
        list-style-type: none;
        background-color:rgb(222, 100, 240);
        box-shadow:inset 2px 2px 3px #3e27ec;
    }
    .nav li ,a{
        text-decoration:none;
        color:#fff;
        font-weight:700;
        padding:7px 4px;
        border-radius:8px;
    }
    .malawi{
        font-size: 21px;
        font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }
    .reg-container{
        background:rgb(239, 239, 247);
        padding:20px 7%;
        border-radius:13px;
        margin:120px 10% 10px 10%;
    }
     #demo{
        background:rgb(254, 254, 254);
        padding:20px 7%;
        border-radius:13px;
        margin:120px 10%;
        display:block;
        align-items:center;
        justify-content: center;
    }
    h3{
        color:rgb(2, 129, 2);
    }
   .avatar {
    width: 100px;
    height: 100px;
    margin: auto;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.spinner {
    width: 82px;
    height: 82px;
    border: 6px solid #e62faf;
    border-top: 6px solid blue;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    position: absolute;
    box-sizing: border-box;
}

.fa-circle-user {
    font-size: 65px;
    background: linear-gradient(90deg,rgb(99, 99, 251), rgb(232, 60, 232));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
    z-index: 1;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

    #form1{
        padding:2px 7%;
    }
    #form1 input{
        border-radius:12px;
        padding:9px;
        border:2px solid #fff;
        width:80%;
        box-shadow: 2px 3px 4px #bbb,inset -2px -3px 4px #bbb;
        margin-bottom:8px;
    }
    #form1 input:focus{
        border:2px solid green;
    }
    #form1 button[type='submit']{
        width:90%;
        border-radius: 12px;
        padding:8px;
        border:none;
        background:linear-gradient(90deg ,rgb(91, 91, 240),rgb(225, 97, 225));
        color:#fff;
        font-weight:900;
    }
    #form1 input[type='radio']{
        width:10%;
        box-shadow: none;
        padding:4px;
        margin-top:8px;
    }
    #form1 label{
        margin-bottom: 14px;
        font-weight:500;
        letter-spacing: 1.4px;
    }

     @media(max-width:768px){
        
        header{
            font-size:15px;
            gap:10px;
        }
        .malawi{
            font-size:17px;
        }
    }
    .divider{
        margin-top:10px;
        display:flex;
        gap:10px;
        align-items: center;
    }
    .divider::before,
    .divider::after{
        content:"";
        flex:1;
        height:1px;
        background:linear-gradient(90deg,rgb(93, 93, 246),rgb(243, 108, 243));
    }
    #contact{
        margin-top:3%;
        display:flex;
        align-items:center;
        justify-content: center;
        gap:25px;
        font-size:26px;
    }
    #contact a{
        text-decoration:none;
    }
</style>
</HEAD>
<header>
    <div class="logo">
        <img src="pics/unima.jpg" alt="unima logo">
    </div>
    <p>UNIVERSITY OF <span class="malawi">MALAWI</span></p>
    <div class="nav">
        <ul>
            <a href="#contact"><li>Contact us</li></a>
        </ul>
    </div>
</header>
<div class="reg-container">
    <div class="avatar">
            <div class="spinner"></div>
<i class="fa-solid fa-circle-user"></i></div>
    <P style="text-align:center;font-weight:900;color:blue;">UNIMA REGISTRATION</P>
    <form id="form1">
        <label for="names">Full names</label><br>
        <input type="text" id="names" name="names" placeholder="👤 Enter your name" required><br>

        <label for="email">Email address</label><br>
        <input type="email" id="email" placeholder="📧 Enter your email" required><br>

        
     <label>Gender</label><br>
     <input type="radio" id="male" name="gender" value="male" required>
     <label for="male">Male</label>
     <input type="radio" id="female" name="gender" value="female">
     <label for="female">Female</label><br>
     

        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="Create a password" required minlength="4"><br>

        <button type="submit" id="submit" onclick="myfunction(event)">&#128274; Sign Up</button>
    </form>

    <p style="display:flex;align-items:center;justify-content:center;font-size:13px;">Have an account? <a href="login.php"  style="color:blue;">Login</a></p>

    <div class="divider"><span>Or continue with</span></div>

    <section id="contact">
        <a href="https://www.unima.ac.mw" target="_blank"><i class="fa-brands fa-google" style="color:#000;"></i></a>
        <i class="fa-brands fa-facebook" style="color:blue;"></i>
        <i class="fa-brands fa-linkedin" style="color:blue;"></i>
        <a href="mailto:bimyna7b@gmail.com" target="_blank"><i class="fa-solid fa-envelope" style="color:black;"></i></a>
    </section>
</div>
<p id="demo"></p>
<script>
    function myfunction(event){
        event.preventDefault();
        
       let name=document.getElementById("names").value.trim();
       if (name ===""){
            alert("please enter your full name!");
            return;
        }
       let mail=document.getElementById("email").value;
       let gender=document.querySelector('input[name="gender"]:checked').value;
       
       document.getElementById("demo").innerHTML=
       "<h3>your details are:</h3>" +
        "<p><strong>Full names:</strong>" + name + "</p>" +
        "<p><strong>Email:</strong>" + mail + "</p>"
        "<p><strong>Gender:</strong>" + gender +"</p>";
    }
</script>
</Body>
</html>
